<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Karte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root {
    --ink:    #1f1e1c;
    --muted:  #6f6d69;
    --signal: #0b5d4e;
    --route:  #d92d20;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 26px rgba(0,0,0,.12);
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: #16202a; }
  #map { position: absolute; inset: 0; }

  /* ---------- Standortnadel ---------- */
  .pin { position: relative; }
  .pin svg { display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  .pin::before {
    content: "";
    position: absolute;
    left: 50%; bottom: 2px;
    width: 16px; height: 16px;
    margin-left: -8px;
    border-radius: 50%;
    background: var(--signal);
    opacity: .35;
    animation: ping 2.4s ease-out 3;
  }
  @keyframes ping {
    0%   { transform: scale(1);   opacity: .35; }
    70%  { transform: scale(4.5); opacity: 0; }
    100% { transform: scale(4.5); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .pin::before { animation: none; opacity: 0; } }

  /* ---------- Halte ---------- */
  .stop-dot {
    position: absolute; left: 0; top: 0;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--route);
    box-shadow: 0 1px 3px rgba(0,0,0,.45);
  }
  .stop.nodot .stop-dot { display: none; }
  .stop-chip {
    position: absolute; left: 18px; top: -8px;
    white-space: nowrap;
    background: rgba(255,255,255,.95);
    border-radius: 6px;
    padding: 4px 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
    pointer-events: none;
  }
  .stop.left .stop-chip { left: auto; right: 18px; text-align: right; }
  .stop-chip .nm { display: block; font-size: 11.5px; font-weight: 600; line-height: 1.25; }
  .stop-chip .tm { display: block; font-family: var(--mono); font-size: 10.5px; line-height: 1.4; }
  .stop-chip .gl { display: block; font-family: var(--mono); font-size: 10.5px; line-height: 1.4; color: var(--muted); }
  .stop.quiet .stop-chip { display: none; }

  /* ---------- Infokarte ---------- */
  .card {
    position: absolute;
    left: 12px; bottom: 12px;
    z-index: 500;
    max-width: min(330px, calc(100% - 24px));
    background: #fff;
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 13px 15px 12px;
  }
  .card h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .card p  { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 3px 0 0; }
  .card .trip {
    display: none;
    white-space: pre-line;
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    margin-top: 7px; padding-top: 7px;
    border-top: 1px solid rgba(0,0,0,.08);
  }
  .card[data-view="anreise"] .trip, .card[data-view="abreise"] .trip { display: block; }
  .card .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .card a {
    font-size: 12.5px; font-weight: 500; color: var(--signal);
    text-decoration: none; border-bottom: 1px solid rgba(11,93,78,.3); padding-bottom: 1px;
  }
  .card a:hover { border-bottom-color: var(--signal); }
  .coords { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .card[data-view="wetter"] .place { display: none; }
  .card:not([data-view="wetter"]) .weather { display: none; }

  /* ---------- Wetter ---------- */
  .card[data-view="wetter"] { max-width: min(430px, calc(100% - 24px)); }
  .w-wrap { position: relative; margin-top: 10px; }
  .w-wrap::after {
    content: "";
    position: absolute; right: 0; top: 0; bottom: 0; width: 24px;
    background: linear-gradient(to left, #fff, rgba(255,255,255,0));
    pointer-events: none;
  }
  .w-strip { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .w-strip::-webkit-scrollbar { display: none; }
  .w-day {
    flex: none; width: 62px;
    display: flex; flex-direction: column; align-items: center;
    padding: 7px 4px 8px;
    border-radius: 10px;
    background: #f6f5f3;
  }
  .w-day.today { background: rgba(11,93,78,.1); }
  .w-day.open  { background: transparent; border: 1px dashed rgba(0,0,0,.15); }
  .w-tag {
    font-family: var(--mono); font-size: 8px; line-height: 11px; height: 11px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--route);
  }
  .w-wd  { font-size: 11.5px; font-weight: 600; line-height: 1.2; }
  .w-dt  { font-family: var(--mono); font-size: 9.5px; color: var(--muted); line-height: 1.25; }
  .w-ic  { margin: 4px 0 2px; height: 26px; }
  .w-max { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
  .w-min { font-size: 11px; color: var(--muted); line-height: 1.2; }
  .w-mm  { font-family: var(--mono); font-size: 9.5px; color: #4a7fb5; line-height: 13px; height: 13px; }
  .w-note { white-space: pre-line; font-size: 10px; color: var(--muted); line-height: 1.5; margin: 9px 0 0; }
  .w-retry {
    font: inherit; font-size: 12.5px; font-weight: 500; color: var(--signal);
    background: transparent; border: 0; padding: 0; margin-top: 6px; cursor: pointer;
    text-decoration: underline;
  }

  /* ---------- Bedienelemente, links oben, weg von Notions Blockmenü ---------- */
  .controls {
    position: absolute;
    left: 12px; top: 12px;
    z-index: 500;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-items: center;
    max-width: calc(100% - 24px);
  }
  .pills {
    display: flex;
    background: #fff;
    border-radius: 999px;
    box-shadow: var(--shadow);
    padding: 3px;
  }
  .pills button {
    font: inherit; font-size: 12.5px; font-weight: 500;
    border: 0; background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    white-space: nowrap;
  }
  #to-house[aria-pressed="true"] { background: var(--signal); color: #fff; }
  #to-anreise[aria-pressed="true"], #to-abreise[aria-pressed="true"] { background: var(--route); color: #fff; }
  #to-weather[aria-pressed="true"] { background: #1d4e89; color: #fff; }
  .short { display: none; }

  .expand {
    width: 34px; height: 34px;
    flex: none;
    display: none; place-items: center;
    background: #fff; border: 0; border-radius: 9px;
    box-shadow: var(--shadow); cursor: pointer; color: var(--ink);
  }
  .expand.available { display: grid; }

  .pills button:focus-visible, .expand:focus-visible, .w-retry:focus-visible,
  .bar button:focus-visible, .bar input:focus-visible {
    outline: 2px solid var(--signal); outline-offset: 2px;
  }

  /* ---------- Hinweis ---------- */
  .hint {
    position: absolute; inset: 0; z-index: 600;
    display: grid; place-items: center;
    background: rgba(24,23,21,.42);
    color: #fff; font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .hint.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }

  /* ---------- Leaflet ruhiger stellen ---------- */
  .leaflet-control-zoom { border: 0 !important; box-shadow: var(--shadow); border-radius: 9px; overflow: hidden; }
  .leaflet-control-zoom a { border: 0 !important; color: var(--ink) !important; }
  .leaflet-control-attribution {
    font-family: var(--sans); font-size: 10px;
    background: rgba(255,255,255,.82) !important;
    color: var(--muted);
  }
  .leaflet-control-attribution a { color: var(--muted); }

  /* ---------- Baukastenleiste: nur beim direkten Aufruf ---------- */
  .bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 700;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: #181715;
    color: #fff;
  }
  .bar.show { display: flex; }
  body.building .card { bottom: 64px; }
  body.building .leaflet-bottom { bottom: 52px; }
  .bar input[type="text"] {
    font: inherit; font-size: 12.5px;
    background: #24231f; color: #fff;
    border: 1px solid #34322d; border-radius: 6px;
    padding: 8px 10px; min-width: 0;
  }
  .bar .name { width: 165px; }
  .bar .adr  { width: 195px; }
  .bar .link { flex: 1; font-family: var(--mono); font-size: 11.5px; color: #cfcdc7; }
  .bar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
  .bar input[type="checkbox"] { accent-color: var(--signal); margin: 0; }
  .bar .tip { font-size: 11.5px; color: #8f8c85; white-space: nowrap; }
  .bar button {
    font: inherit; font-size: 12.5px; font-weight: 500;
    background: var(--signal); color: #fff;
    border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; white-space: nowrap;
  }
  @media (max-width: 900px) { .bar .name, .bar .adr, .bar .tip { display: none; } }

  /* ---------- Schmale Einbettung, etwa eine Notion-Spalte auf dem iPad ---------- */
  @media (max-width: 480px) {
    .card { left: 8px; right: 8px; bottom: 8px; max-width: none; padding: 8px 11px; }
    .card h1 { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .place p, .place .trip, .coords { display: none; }
    .card[data-view="anreise"] .trip, .card[data-view="abreise"] .trip { display: none; }
    .card .row { margin-top: 6px; }
    .w-day { width: 58px; }
    .controls { left: 8px; top: 8px; gap: 5px; }
    .pills { padding: 2px; }
    .pills button { font-size: 11.5px; padding: 5px 9px; }
    .long { display: none; }
    .short { display: inline; }
    .expand { width: 30px; height: 30px; }
    .stop-chip { padding: 3px 6px; }
    .stop-chip .nm { font-size: 10px; }
    .stop-chip .tm, .stop-chip .gl { font-size: 9.5px; }
    .leaflet-control-attribution { font-size: 9px; }
    .leaflet-control-zoom { transform: scale(.88); transform-origin: bottom right; }
  }

  .failure {
    position: absolute; inset: 0; z-index: 800;
    display: grid; place-items: center; padding: 24px;
    background: #f4f2ee; text-align: center;
  }
  .failure p { max-width: 40ch; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .failure strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 6px; }
</style>
</head>
<body>

<div id="map"></div>

<div class="controls">
  <div class="pills">
    <button type="button" id="to-house" aria-pressed="false">
      <span class="long">Freizeithaus</span><span class="short">Haus</span>
    </button>
    <button type="button" id="to-anreise" aria-pressed="true">Anreise</button>
    <button type="button" id="to-abreise" aria-pressed="false">Abreise</button>
  </div>
  <div class="pills">
    <button type="button" id="to-weather" aria-pressed="false">Wetter</button>
  </div>
  <button type="button" class="expand" id="expand" title="Vollbild" aria-label="Vollbild">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M6 1.5H1.5V6M10 14.5h4.5V10M14.5 6V1.5H10M1.5 10v4.5H6"/>
    </svg>
  </button>
</div>

<div class="card" id="card">
  <div class="place">
    <h1 id="c-name"></h1>
    <p id="c-adr"></p>
    <p class="trip" id="c-trip"></p>
    <div class="row">
      <a id="c-route" href="#" target="_blank" rel="noopener">Route öffnen</a>
      <span class="coords" id="c-coords"></span>
    </div>
  </div>
  <div class="weather">
    <h1>Wetter am Freizeithaus</h1>
    <div id="w-body"></div>
    <p class="w-note" id="w-note"></p>
  </div>
</div>

<div class="hint" id="hint">Zum Zoomen erst in die Karte klicken</div>

<div class="bar" id="bar">
  <span class="tip">Klick setzt die Nadel</span>
  <input type="text" class="name" id="b-name" placeholder="Name">
  <input type="text" class="adr" id="b-adr" placeholder="Adresse">
  <label><input type="checkbox" id="b-routen" checked> Routen</label>
  <input type="text" class="link" id="b-link" readonly>
  <button type="button" id="b-copy">Link kopieren</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  "use strict";

  /* Voreinstellung: Sommerlager Dänemark.
     lat/lng ist die Nadel, clat/clng/z der Bildausschnitt beim Öffnen. */
  var CONFIG = {
    lat: 56.4262961,
    lng: 8.9400606,
    clat: null,
    clng: null,
    z: 18,
    name: "Trevæld Spejdercenter",
    adr: "Trevældvej 7, 7830 Vinderup, Dänemark",
    routen: true,
    route: "anreise"
  };

  /* Zeitraum für die Wettervorhersage: Anreisetag bis Abreisetag. */
  var LAGER = { von: "2026-08-04", bis: "2026-08-15" };

  var HOUSE_ZOOM = 18;
  var ROUTE_MAX_ZOOM = 12;

  /* Feste Punkte, damit Hin- und Rückweg dieselben Koordinaten benutzen. */
  var P = {
    l13:        [48.136198, 11.562735],
    muenchen:   [48.140411, 11.558268],
    ingolstadt: [48.744900, 11.437400],
    nuernberg:  [49.445500, 11.082400],
    wuerzburg:  [49.801600,  9.935800],
    fulda:      [50.554500,  9.684400],
    kassel:     [51.312800,  9.447000],
    goettingen: [51.536600,  9.926500],
    hannover:   [52.376500,  9.741100],
    lueneburg:  [53.249600, 10.414700],
    harburg:    [53.456255,  9.991618],
    hamburg:    [53.552800, 10.006800],
    dammtor:    [53.560800,  9.989300],
    altona:     [53.552800,  9.935000],
    eidelstedt: [53.604700,  9.904200],
    pinneberg:  [53.655355,  9.797693],
    elmshorn:   [53.753900,  9.653400],
    neumuenster:[54.072300,  9.980800],
    rendsburg:  [54.303300,  9.664700],
    schleswig:  [54.506000,  9.568000],
    flensburg:  [54.774671,  9.436837],
    padborg:    [54.825000,  9.360000],
    aabenraa:   [55.044400,  9.418000],
    haderslev:  [55.249700,  9.489000],
    kolding:    [55.490400,  9.472200],
    vejle:      [55.709000,  9.535000],
    give:       [55.850000,  9.240000],
    herning:    [56.139000,  8.976000],
    sevel:      [56.380000,  8.870000],
    trevaeld:   [56.426296,  8.940061]
  };

  /* Zwischenpunkte liegen grob am tatsächlichen Streckenverlauf.
     Halte: zeit = Uhrzeiten, gleis = Verkehrsmittel und Bahnsteig. */
  var JOURNEYS = {
    anreise: {
      trip: "L13 05:30 → Trevæld 20:00\n14 Std 30 Min · Fußweg, Zug, Zug, Zug, Bus",
      legs: [
        { style: "walk", points: [P.l13, P.muenchen] },
        { style: "rail", points: [P.muenchen, P.ingolstadt, P.nuernberg, P.wuerzburg, P.fulda,
                                  P.kassel, P.goettingen, P.hannover, P.lueneburg, P.harburg] },
        { style: "rail", points: [P.harburg, P.hamburg, P.altona, P.eidelstedt, P.pinneberg] },
        { style: "rail", points: [P.pinneberg, P.elmshorn, P.neumuenster, P.rendsburg, P.schleswig, P.flensburg] },
        { style: "bus",  points: [P.flensburg, P.padborg, P.aabenraa, P.haderslev, P.kolding,
                                  P.vejle, P.give, P.herning, P.sevel, P.trevaeld] }
      ],
      stops: [
        { at: P.l13,       name: "Landwehrstraße 13", zeit: "ab 05:30",            gleis: "Fußweg zum Hbf", minZoom: 11 },
        { at: P.muenchen,  name: "München Hbf",       zeit: "an 05:55 · ab 06:09", gleis: "ICE 886 · Gleis 23", minZoom: 4 },
        { at: P.harburg,   name: "Hamburg-Harburg",   zeit: "an 11:44 · ab 11:59", gleis: "S3 · Gleis 1 → 11",  minZoom: 7 },
        { at: P.pinneberg, name: "Pinneberg",         zeit: "an 12:53 · ab 12:57", gleis: "RE7 · Gleis 1 → offen", minZoom: 9, side: "left" },
        { at: P.flensburg, name: "Flensburg Hbf",     zeit: "an 14:42 · ab 16:30", gleis: "Bus zum Freizeithaus", minZoom: 7 },
        { at: P.trevaeld,  name: "Trevæld",           zeit: "an 20:00",            minZoom: 4, side: "left", dot: false }
      ]
    },
    abreise: {
      trip: "Trevæld 07:30 → L13 21:10\n13 Std 40 Min · Bus, Zug, Zug, Fußweg",
      legs: [
        { style: "bus",  points: [P.trevaeld, P.sevel, P.herning, P.give, P.vejle,
                                  P.kolding, P.haderslev, P.aabenraa, P.padborg, P.flensburg] },
        { style: "rail", points: [P.flensburg, P.schleswig, P.rendsburg, P.neumuenster,
                                  P.elmshorn, P.pinneberg, P.altona, P.dammtor] },
        { style: "rail", points: [P.dammtor, P.hamburg, P.harburg, P.lueneburg, P.hannover,
                                  P.goettingen, P.kassel, P.fulda, P.wuerzburg, P.nuernberg,
                                  P.ingolstadt, P.muenchen] },
        { style: "walk", points: [P.muenchen, P.l13] }
      ],
      stops: [
        { at: P.trevaeld,  name: "Trevæld",           zeit: "ab 07:30",            gleis: "Bus nach Flensburg", minZoom: 4, side: "left", dot: false },
        { at: P.flensburg, name: "Flensburg Hbf",     zeit: "an 11:00 · ab 12:22", gleis: "RE7 · Gleis 2",      minZoom: 7 },
        { at: P.dammtor,   name: "Hamburg Dammtor",   zeit: "an 14:16 · ab 14:53", gleis: "ICE 681 · Gleis 4",  minZoom: 7 },
        { at: P.muenchen,  name: "München Hbf",       zeit: "an 20:50",            gleis: "Gleis 19",           minZoom: 4 },
        { at: P.l13,       name: "Landwehrstraße 13", zeit: "an 21:10",            gleis: "Fußweg vom Hbf",     minZoom: 11 }
      ]
    }
  };

  var el = function (id) { return document.getElementById(id); };

  if (typeof L === "undefined") {
    var failure = document.createElement("div");
    failure.className = "failure";
    failure.innerHTML = "<p><strong>Karte konnte nicht geladen werden</strong>" +
      "Die Kartenbibliothek war nicht erreichbar. Adresse: " + CONFIG.name + ", " + CONFIG.adr + "</p>";
    document.body.appendChild(failure);
    return;
  }

  /* ---------------- Einstellungen aus dem Link ---------------- */

  var params = new URLSearchParams(location.search);
  var config = Object.assign({}, CONFIG);
  ["name", "adr"].forEach(function (key) {
    if (params.has(key)) config[key] = params.get(key);
  });
  ["lat", "lng", "clat", "clng", "z"].forEach(function (key) {
    var value = parseFloat(params.get(key));
    if (!isNaN(value)) config[key] = value;
  });
  if (params.has("routen")) config.routen = params.get("routen") === "1";
  if (JOURNEYS[params.get("route")]) config.route = params.get("route");

  var place = L.latLng(config.lat, config.lng);
  var current = config.route;
  var panel = "ort";
  var viewFromLink = params.has("z") || params.has("clat") || params.has("clng");

  function fitPadding() {
    return map.getSize().x < 480 ? [20, 20] : [44, 44];
  }

  /* ---------------- Karte ---------------- */

  var map = L.map("map", { zoomControl: false, scrollWheelZoom: false, maxZoom: 19 });

  var routes = {};
  Object.keys(JOURNEYS).forEach(function (key) {
    var bounds = null;
    JOURNEYS[key].legs.forEach(function (leg) {
      var legBounds = L.latLngBounds(leg.points);
      bounds = bounds ? bounds.extend(legBounds) : legBounds;
    });
    routes[key] = { layer: L.layerGroup(), bounds: bounds, markers: [] };
  });

  if (viewFromLink) {
    var center = (config.clat !== null && config.clng !== null)
      ? L.latLng(config.clat, config.clng)
      : place;
    map.setView(center, config.z);
  } else if (config.routen) {
    map.fitBounds(routes[current].bounds, { padding: fitPadding(), animate: false });
  } else {
    map.setView(place, HOUSE_ZOOM);
  }

  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19,
    attribution: "Luftbild: Esri, Maxar, Earthstar Geographics"
  }).addTo(map);

  L.control.zoom({ position: "bottomright" }).addTo(map);

  /* ---------------- Nadel und Infokarte ---------------- */

  var pinIcon = L.divIcon({
    className: "",
    iconSize: [30, 40],
    iconAnchor: [15, 40],
    html: '<div class="pin"><svg width="30" height="40" viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M15 39c0-9 11-14.5 11-24A11 11 0 1 0 4 15c0 9.5 11 15 11 24z" fill="#0b5d4e"/>' +
          '<circle cx="15" cy="14.5" r="4.4" fill="#fff"/></svg></div>'
  });
  var pin = L.marker(place, { icon: pinIcon, keyboard: false, alt: config.name }).addTo(map);

  function describePlace() {
    pin.setLatLng(place);
    el("c-name").textContent = el("b-name").value.trim() || config.name;
    el("c-adr").textContent = el("b-adr").value.trim() || config.adr;
    el("c-coords").textContent = place.lat.toFixed(4) + ", " + place.lng.toFixed(4);
    el("c-route").href = "https://www.google.com/maps/dir/?api=1&destination=" + place.lat + "," + place.lng;
  }

  /* ---------------- Routen zeichnen ---------------- */

  var STROKES = {
    walk: { weight: 3, dashArray: "1 7" },
    rail: { weight: 3.5, dashArray: null },
    bus:  { weight: 3.5, dashArray: "9 7" }
  };

  function escapeText(value) {
    return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  Object.keys(JOURNEYS).forEach(function (key) {
    var route = routes[key];

    JOURNEYS[key].legs.forEach(function (leg) {
      var stroke = STROKES[leg.style];
      L.polyline(leg.points, {
        color: "#ffffff", weight: stroke.weight + 3, opacity: .8,
        lineCap: "round", lineJoin: "round", interactive: false
      }).addTo(route.layer);
      L.polyline(leg.points, {
        color: "#d92d20", weight: stroke.weight, opacity: 1,
        dashArray: stroke.dashArray, lineCap: "round", lineJoin: "round", interactive: false
      }).addTo(route.layer);
    });

    JOURNEYS[key].stops.forEach(function (stop) {
      var classes = "stop";
      if (stop.side === "left") classes += " left";
      if (stop.dot === false) classes += " nodot";
      var html = '<span class="stop-dot"></span><span class="stop-chip">' +
                 '<span class="nm">' + escapeText(stop.name) + '</span>' +
                 '<span class="tm">' + escapeText(stop.zeit) + '</span>' +
                 (stop.gleis ? '<span class="gl">' + escapeText(stop.gleis) + '</span>' : '') +
                 '</span>';
      var marker = L.marker(stop.at, {
        keyboard: false,
        interactive: false,
        icon: L.divIcon({ className: classes, iconSize: [12, 12], iconAnchor: [6, 6], html: html })
      });
      marker.addTo(route.layer);
      route.markers.push({ marker: marker, minZoom: stop.minZoom });
    });
  });

  function refreshRoutes() {
    var zoom = map.getZoom();
    var visible = config.routen && zoom <= ROUTE_MAX_ZOOM;

    Object.keys(routes).forEach(function (key) {
      var route = routes[key];
      var show = visible && key === current;
      if (show && !map.hasLayer(route.layer)) route.layer.addTo(map);
      if (!show && map.hasLayer(route.layer)) map.removeLayer(route.layer);
      if (!show) return;
      route.markers.forEach(function (entry) {
        var element = entry.marker.getElement();
        if (element) element.classList.toggle("quiet", zoom < entry.minZoom);
      });
    });

    var onWeather = panel === "wetter";
    el("to-house").setAttribute("aria-pressed", String(!visible && !onWeather));
    el("to-anreise").setAttribute("aria-pressed", String(visible && !onWeather && current === "anreise"));
    el("to-abreise").setAttribute("aria-pressed", String(visible && !onWeather && current === "abreise"));
    el("to-weather").setAttribute("aria-pressed", String(onWeather));
    el("to-anreise").hidden = !config.routen;
    el("to-abreise").hidden = !config.routen;

    el("card").dataset.view = onWeather ? "wetter" : (visible ? current : "haus");
    el("c-trip").textContent = JOURNEYS[current].trip;
  }

  map.on("zoomend", refreshRoutes);

  el("to-house").addEventListener("click", function () {
    panel = "ort";
    map.setView(place, HOUSE_ZOOM, { animate: false });
    refreshRoutes();
  });

  function showRoute(key) {
    panel = "ort";
    current = key;
    map.fitBounds(routes[key].bounds, { padding: fitPadding(), animate: false });
    refreshRoutes();
  }
  el("to-anreise").addEventListener("click", function () { showRoute("anreise"); });
  el("to-abreise").addEventListener("click", function () { showRoute("abreise"); });

  /* ---------------- Wetter ---------------- */
  /* Open-Meteo braucht keinen Schlüssel und kein Konto. Abgerufen wird erst
     beim Klick, das Ergebnis hält eine halbe Stunde. Fällt der Dienst aus,
     betrifft das nur diese Karte, nicht den Rest. */

  /* Eigene Symbole statt Emoji: einheitliche Strichstärke, gleiche Farben
     wie der Rest der Karte, gleiche Darstellung auf jedem Gerät. */
  var SUN = "#e8a33c", CLOUD = "#9aa3ab", DARK = "#858e96", WATER = "#4a7fb5", ICE = "#7fa8c9";

  function cloud(color, high) {
    return high
      ? '<path d="M7.6 16.5h8.8a3.5 3.5 0 0 0 .45-6.97 4.95 4.95 0 0 0-9.48-.83A3.55 3.55 0 0 0 7.6 16.5Z" fill="' + color + '"/>'
      : '<path d="M7.6 18.6h8.8a3.6 3.6 0 0 0 .45-7.17 5.05 5.05 0 0 0-9.68-.85A3.65 3.65 0 0 0 7.6 18.6Z" fill="' + color + '"/>';
  }
  function drops(count) {
    var paths = ["M9.6 18.3l-.9 2.4", "M13 18.3l-.9 2.4", "M16.4 18.3l-.9 2.4"].slice(0, count);
    return '<g stroke="' + WATER + '" stroke-width="1.7" stroke-linecap="round"><path d="' +
           paths.join("") + '"/></g>';
  }

  var SHAPES = {
    clear: '<circle cx="12" cy="12" r="4.7" fill="' + SUN + '"/>' +
           '<g stroke="' + SUN + '" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.6v2.6M12 18.8v2.6' +
           'M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"/></g>',
    few:   '<circle cx="9.2" cy="8.4" r="3.5" fill="' + SUN + '"/>' +
           '<g stroke="' + SUN + '" stroke-width="1.6" stroke-linecap="round"><path d="M9.2 2.2v1.9' +
           'M3 8.4h1.9M4.8 4l1.4 1.4M13.6 4l-1.4 1.4"/></g>' + cloud(CLOUD, false),
    over:  cloud(DARK, false),
    fog:   cloud(CLOUD, true) +
           '<g stroke="' + CLOUD + '" stroke-width="1.7" stroke-linecap="round"><path d="M6.4 19.4h11.2M8.8 22h6.4"/></g>',
    driz:  cloud(CLOUD, true) + drops(2),
    rain:  cloud(DARK, true) + drops(3),
    snow:  cloud(CLOUD, true) +
           '<g stroke="' + ICE + '" stroke-width="1.6" stroke-linecap="round"><path d="M9.4 20.4h2.2M10.5 19.3v2.2' +
           'M14.4 20.4h2.2M15.5 19.3v2.2"/></g>',
    storm: cloud(DARK, true) +
           '<path d="M13.4 17.4l-3.4 4.2h2.5l-.7 2.3 3.5-4.4h-2.5z" fill="' + SUN + '"/>'
  };

  /* WMO-Schlüssel: Symbol und Klartext für die Beschriftung. */
  var WMO = {
    0:  ["clear", "klar"],
    1:  ["few",   "meist klar"],
    2:  ["few",   "wolkig"],
    3:  ["over",  "bedeckt"],
    45: ["fog",   "Nebel"],
    48: ["fog",   "Reifnebel"],
    51: ["driz",  "leichter Niesel"],
    53: ["driz",  "Niesel"],
    55: ["driz",  "starker Niesel"],
    61: ["driz",  "leichter Regen"],
    63: ["rain",  "Regen"],
    65: ["rain",  "starker Regen"],
    71: ["snow",  "leichter Schnee"],
    73: ["snow",  "Schnee"],
    75: ["snow",  "starker Schnee"],
    80: ["driz",  "leichte Schauer"],
    81: ["rain",  "Schauer"],
    82: ["storm", "heftige Schauer"],
    95: ["storm", "Gewitter"],
    96: ["storm", "Gewitter mit Hagel"],
    99: ["storm", "Gewitter mit Hagel"]
  };

  function iconFor(code) {
    var entry = WMO[code] || ["over", "unbekannt"];
    var svg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
              SHAPES[entry[0]] + '</svg>';
    return { svg: svg, label: entry[1] };
  }

  var WEEKDAYS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  var weatherCache = null;

  function dayList() {
    var days = [];
    var cursor = new Date(LAGER.von + "T12:00:00");
    var last = new Date(LAGER.bis + "T12:00:00");
    while (cursor <= last && days.length < 40) {
      days.push(new Date(cursor));
      cursor.setDate(cursor.getDate() + 1);
    }
    return days;
  }

  function isoDay(date) {
    return date.getFullYear() + "-" +
           String(date.getMonth() + 1).padStart(2, "0") + "-" +
           String(date.getDate()).padStart(2, "0");
  }

  function labelDay(date) {
    return WEEKDAYS[date.getDay()] + " " +
           String(date.getDate()).padStart(2, "0") + "." +
           String(date.getMonth() + 1).padStart(2, "0") + ".";
  }

  function renderWeather(data) {
    var days = dayList();
    var heute = isoDay(new Date());
    var strip = document.createElement("div");
    strip.className = "w-strip";
    var todayTile = null;

    days.forEach(function (date, position) {
      var key = isoDay(date);
      var index = data.daily.time.indexOf(key);
      var tile = document.createElement("div");
      tile.className = "w-day" + (index === -1 ? " open" : "") + (key === heute ? " today" : "");

      var tag = document.createElement("span");
      tag.className = "w-tag";
      tag.textContent = position === 0 ? "Anreise" : (position === days.length - 1 ? "Abreise" : "");
      tile.appendChild(tag);

      var weekday = document.createElement("span");
      weekday.className = "w-wd";
      weekday.textContent = WEEKDAYS[date.getDay()];
      tile.appendChild(weekday);

      var stamp = document.createElement("span");
      stamp.className = "w-dt";
      stamp.textContent = String(date.getDate()).padStart(2, "0") + "." +
                          String(date.getMonth() + 1).padStart(2, "0") + ".";
      tile.appendChild(stamp);

      if (index === -1) {
        var placeholder = document.createElement("span");
        placeholder.className = "w-ic";
        placeholder.style.display = "grid";
        placeholder.style.placeItems = "center";
        placeholder.style.color = "#b6b3ad";
        placeholder.textContent = "–";
        tile.appendChild(placeholder);

        var pending = document.createElement("span");
        pending.className = "w-min";
        pending.textContent = "offen";
        tile.appendChild(pending);
        strip.appendChild(tile);
        return;
      }

      var icon = iconFor(data.daily.weather_code[index]);
      var holder = document.createElement("span");
      holder.className = "w-ic";
      holder.innerHTML = icon.svg;
      holder.title = icon.label;
      tile.appendChild(holder);

      var high = document.createElement("span");
      high.className = "w-max";
      high.textContent = Math.round(data.daily.temperature_2m_max[index]) + "°";
      tile.appendChild(high);

      var low = document.createElement("span");
      low.className = "w-min";
      low.textContent = Math.round(data.daily.temperature_2m_min[index]) + "°";
      tile.appendChild(low);

      var mm = data.daily.precipitation_sum[index];
      var rain = document.createElement("span");
      rain.className = "w-mm";
      rain.textContent = (mm && mm >= 0.1) ? (Math.round(mm * 10) / 10) + " mm" : "";
      tile.appendChild(rain);

      if (key === heute) todayTile = tile;
      strip.appendChild(tile);
    });

    var wrap = document.createElement("div");
    wrap.className = "w-wrap";
    wrap.appendChild(strip);
    el("w-body").replaceChildren(wrap);

    if (todayTile) strip.scrollLeft = Math.max(0, todayTile.offsetLeft - 8);

    var stand = new Date(data.abgerufen);
    el("w-note").textContent =
      "Abgerufen " + String(stand.getHours()).padStart(2, "0") + ":" +
      String(stand.getMinutes()).padStart(2, "0") + " · Open-Meteo\n" +
      "Über eine Woche im Voraus ist das ein Trend, keine Zusage.";
  }

  function weatherMessage(text, withRetry) {
    var paragraph = document.createElement("p");
    paragraph.className = "w-note";
    paragraph.textContent = text;
    el("w-body").replaceChildren(paragraph);
    if (withRetry) {
      var retry = document.createElement("button");
      retry.type = "button";
      retry.className = "w-retry";
      retry.textContent = "Erneut versuchen";
      retry.addEventListener("click", function () { loadWeather(true); });
      el("w-body").appendChild(retry);
    }
    el("w-note").textContent = "";
  }

  function loadWeather(force) {
    if (!force && weatherCache && Date.now() - weatherCache.abgerufen < 1800000) {
      renderWeather(weatherCache);
      return;
    }

    weatherMessage("Vorhersage wird geladen …", false);

    var url = "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + place.lat.toFixed(4) +
      "&longitude=" + place.lng.toFixed(4) +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum" +
      "&timezone=Europe%2FCopenhagen&forecast_days=16";

    var stop = new AbortController();
    var timer = setTimeout(function () { stop.abort(); }, 9000);

    fetch(url, { signal: stop.signal })
      .then(function (response) {
        if (!response.ok) throw new Error("Antwort " + response.status);
        return response.json();
      })
      .then(function (data) {
        if (!data || !data.daily || !data.daily.time) throw new Error("Unerwartete Antwort");
        data.abgerufen = Date.now();
        weatherCache = data;
        renderWeather(data);
      })
      .catch(function () {
        weatherMessage("Die Vorhersage ist gerade nicht erreichbar. Der Rest der Karte funktioniert weiter.", true);
      })
      .then(function () { clearTimeout(timer); });
  }

  el("to-weather").addEventListener("click", function () {
    panel = panel === "wetter" ? "ort" : "wetter";
    refreshRoutes();
    if (panel === "wetter") loadWeather(false);
  });

  /* ---------------- Vollbild, falls die Umgebung es erlaubt ---------------- */

  var root = document.documentElement;
  var enterFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
  var leaveFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
  var inFullscreen = function () { return document.fullscreenElement || document.webkitFullscreenElement; };

  if ((document.fullscreenEnabled || document.webkitFullscreenEnabled) && enterFullscreen) {
    el("expand").classList.add("available");
    el("expand").addEventListener("click", function () {
      if (inFullscreen()) leaveFullscreen.call(document);
      else enterFullscreen.call(root);
    });
    document.addEventListener("fullscreenchange", function () { map.invalidateSize(); });
    document.addEventListener("webkitfullscreenchange", function () { map.invalidateSize(); });
  }

  /* ---------------- Rücksicht auf die Notion-Seite ---------------- */

  var hint = el("hint");
  var hintTimer = null;

  function flashHint(text) {
    hint.textContent = text;
    hint.classList.add("show");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hint.classList.remove("show"); }, 1400);
  }

  var container = map.getContainer();

  container.addEventListener("wheel", function () {
    if (!map.scrollWheelZoom.enabled()) flashHint("Zum Zoomen erst in die Karte klicken");
  }, { passive: true });

  map.on("click", function () { map.scrollWheelZoom.enable(); });
  map.on("mouseout", function () { map.scrollWheelZoom.disable(); });

  if (window.matchMedia("(hover: none)").matches) {
    map.dragging.disable();
    container.addEventListener("touchstart", function (event) {
      if (event.touches.length > 1) map.dragging.enable();
    }, { passive: true });
    container.addEventListener("touchmove", function (event) {
      if (event.touches.length === 1 && !map.dragging.enabled()) flashHint("Mit zwei Fingern bewegen");
    }, { passive: true });
    container.addEventListener("touchend", function (event) {
      if (event.touches.length === 0) map.dragging.disable();
    }, { passive: true });
  }

  describePlace();
  refreshRoutes();

  /* ---------------- Baukasten (nur beim direkten Aufruf sichtbar) ---------------- */

  if (window.self !== window.top) return;

  el("bar").classList.add("show");
  document.body.classList.add("building");
  el("b-name").value = config.name;
  el("b-adr").value = config.adr;
  el("b-routen").checked = config.routen;

  function updateLink() {
    var center = map.getCenter();
    var query = new URLSearchParams({
      lat: place.lat.toFixed(6),
      lng: place.lng.toFixed(6),
      clat: center.lat.toFixed(6),
      clng: center.lng.toFixed(6),
      z: String(map.getZoom()),
      name: el("b-name").value.trim(),
      adr: el("b-adr").value.trim()
    });
    if (!config.routen) query.set("routen", "0");
    if (current !== "anreise") query.set("route", current);
    el("b-link").value = location.origin + location.pathname + "?" + query.toString();
  }

  map.on("moveend", updateLink);
  map.on("click", function (event) {
    place = event.latlng;
    weatherCache = null;
    describePlace();
    updateLink();
  });
  el("b-name").addEventListener("input", function () { describePlace(); updateLink(); });
  el("b-adr").addEventListener("input", function () { describePlace(); updateLink(); });
  el("b-routen").addEventListener("change", function () {
    config.routen = el("b-routen").checked;
    refreshRoutes();
    updateLink();
  });
  el("to-anreise").addEventListener("click", updateLink);
  el("to-abreise").addEventListener("click", updateLink);
  updateLink();

  el("b-copy").addEventListener("click", function () {
    var button = el("b-copy");
    var done = function () {
      button.textContent = "Kopiert";
      setTimeout(function () { button.textContent = "Link kopieren"; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(el("b-link").value).then(done, function () { el("b-link").select(); });
    } else {
      el("b-link").select();
      document.execCommand("copy");
      done();
    }
  });
})();
</script>
</body>
</html>
