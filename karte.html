<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Karte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root {
    --ink:    #1f1e1c;
    --muted:  #6f6d69;
    --signal: #0b5d4e;
    --route:  #d92d20;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 26px rgba(0,0,0,.12);
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: #16202a; }
  #map { position: absolute; inset: 0; }

  /* ---------- Standortnadel ---------- */
  .pin { position: relative; }
  .pin svg { display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  .pin::before {
    content: "";
    position: absolute;
    left: 50%; bottom: 2px;
    width: 16px; height: 16px;
    margin-left: -8px;
    border-radius: 50%;
    background: var(--signal);
    opacity: .35;
    animation: ping 2.4s ease-out 3;
  }
  @keyframes ping {
    0%   { transform: scale(1);   opacity: .35; }
    70%  { transform: scale(4.5); opacity: 0; }
    100% { transform: scale(4.5); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .pin::before { animation: none; opacity: 0; } }

  /* ---------- Halte auf der Anreise ---------- */
  .stop-dot {
    position: absolute; left: 0; top: 0;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--route);
    box-shadow: 0 1px 3px rgba(0,0,0,.45);
  }
  .stop.nodot .stop-dot { display: none; }
  .stop-chip {
    position: absolute; left: 18px; top: -6px;
    white-space: nowrap;
    background: rgba(255,255,255,.94);
    border-radius: 6px;
    padding: 3px 7px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
    pointer-events: none;
  }
  .stop.left .stop-chip { left: auto; right: 18px; text-align: right; }
  .stop-chip b { display: block; font-size: 11.5px; font-weight: 600; line-height: 1.25; }
  .stop-chip i { display: block; font-family: var(--mono); font-style: normal; font-size: 10px; color: var(--muted); }
  .stop.quiet .stop-chip { display: none; }

  /* ---------- Infokarte ---------- */
  .card {
    position: absolute;
    left: 12px; bottom: 12px;
    z-index: 500;
    max-width: min(330px, calc(100% - 24px));
    background: #fff;
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 13px 15px 12px;
  }
  .card h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .card p  { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 3px 0 0; }
  .card .trip {
    display: none;
    white-space: pre-line;
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    margin-top: 7px; padding-top: 7px;
    border-top: 1px solid rgba(0,0,0,.08);
  }
  .card[data-view="anreise"] .trip { display: block; }
  .card .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .card a {
    font-size: 12.5px; font-weight: 500; color: var(--signal);
    text-decoration: none; border-bottom: 1px solid rgba(11,93,78,.3); padding-bottom: 1px;
  }
  .card a:hover { border-bottom-color: var(--signal); }
  .coords { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* ---------- Bedienelemente, links oben, weg von Notions Blockmenü ---------- */
  .pills {
    position: absolute;
    left: 12px; top: 12px;
    z-index: 500;
    display: flex;
    background: #fff;
    border-radius: 999px;
    box-shadow: var(--shadow);
    padding: 3px;
  }
  .pills button {
    font: inherit; font-size: 12.5px; font-weight: 500;
    border: 0; background: transparent; color: var(--muted);
    padding: 6px 13px; border-radius: 999px; cursor: pointer;
  }
  #to-house[aria-pressed="true"] { background: var(--signal); color: #fff; }
  #to-route[aria-pressed="true"] { background: var(--route); color: #fff; }

  .expand {
    position: absolute;
    left: 12px; top: 53px;
    z-index: 500;
    width: 34px; height: 34px;
    display: none; place-items: center;
    background: #fff; border: 0; border-radius: 9px;
    box-shadow: var(--shadow); cursor: pointer; color: var(--ink);
  }
  .expand.available { display: grid; }

  .pills button:focus-visible, .expand:focus-visible,
  .bar button:focus-visible, .bar input:focus-visible {
    outline: 2px solid var(--signal); outline-offset: 2px;
  }

  /* ---------- Hinweis ---------- */
  .hint {
    position: absolute; inset: 0; z-index: 600;
    display: grid; place-items: center;
    background: rgba(24,23,21,.42);
    color: #fff; font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .hint.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }

  /* ---------- Leaflet ruhiger stellen ---------- */
  .leaflet-control-zoom { border: 0 !important; box-shadow: var(--shadow); border-radius: 9px; overflow: hidden; }
  .leaflet-control-zoom a { border: 0 !important; color: var(--ink) !important; }
  .leaflet-control-attribution {
    font-family: var(--sans); font-size: 10px;
    background: rgba(255,255,255,.82) !important;
    color: var(--muted);
  }
  .leaflet-control-attribution a { color: var(--muted); }

  /* ---------- Baukastenleiste: nur beim direkten Aufruf ---------- */
  .bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 700;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: #181715;
    color: #fff;
  }
  .bar.show { display: flex; }
  body.building .card { bottom: 64px; }
  body.building .leaflet-bottom { bottom: 52px; }
  .bar input[type="text"] {
    font: inherit; font-size: 12.5px;
    background: #24231f; color: #fff;
    border: 1px solid #34322d; border-radius: 6px;
    padding: 8px 10px; min-width: 0;
  }
  .bar .name { width: 165px; }
  .bar .adr  { width: 195px; }
  .bar .link { flex: 1; font-family: var(--mono); font-size: 11.5px; color: #cfcdc7; }
  .bar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
  .bar input[type="checkbox"] { accent-color: var(--signal); margin: 0; }
  .bar .tip { font-size: 11.5px; color: #8f8c85; white-space: nowrap; }
  .bar button {
    font: inherit; font-size: 12.5px; font-weight: 500;
    background: var(--signal); color: #fff;
    border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; white-space: nowrap;
  }
  @media (max-width: 900px) { .bar .name, .bar .adr, .bar .tip { display: none; } }

  .failure {
    position: absolute; inset: 0; z-index: 800;
    display: grid; place-items: center; padding: 24px;
    background: #f4f2ee; text-align: center;
  }
  .failure p { max-width: 40ch; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .failure strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 6px; }
</style>
</head>
<body>

<div id="map"></div>

<div class="pills">
  <button type="button" id="to-house" aria-pressed="false">Haus</button>
  <button type="button" id="to-route" aria-pressed="true">Anreise</button>
</div>

<button type="button" class="expand" id="expand" title="Vollbild" aria-label="Vollbild">
  <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M6 1.5H1.5V6M10 14.5h4.5V10M14.5 6V1.5H10M1.5 10v4.5H6"/>
  </svg>
</button>

<div class="card" id="card">
  <h1 id="c-name"></h1>
  <p id="c-adr"></p>
  <p class="trip" id="c-trip"></p>
  <div class="row">
    <a id="c-route" href="#" target="_blank" rel="noopener">Route öffnen</a>
    <span class="coords" id="c-coords"></span>
  </div>
</div>

<div class="hint" id="hint">Zum Zoomen erst in die Karte klicken</div>

<div class="bar" id="bar">
  <span class="tip">Klick setzt die Nadel</span>
  <input type="text" class="name" id="b-name" placeholder="Name">
  <input type="text" class="adr" id="b-adr" placeholder="Adresse">
  <label><input type="checkbox" id="b-anreise" checked> Anreise</label>
  <input type="text" class="link" id="b-link" readonly>
  <button type="button" id="b-copy">Link kopieren</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  "use strict";

  /* Voreinstellung: Sommerlager Dänemark.
     lat/lng ist die Nadel, clat/clng/z der Bildausschnitt beim Öffnen.
     Ohne Angabe im Link startet die Karte auf der ganzen Anreise. */
  var CONFIG = {
    lat: 56.4262961,
    lng: 8.9400606,
    clat: null,
    clng: null,
    z: 18,
    name: "Trevæld Spejdercenter",
    adr: "Trevældvej 7, 7830 Vinderup, Dänemark",
    anreise: true
  };

  var HOUSE_ZOOM = 18;

  /* Ab dieser Zoomstufe abwärts ist die Anreise zu sehen. Weiter drin wäre die
     grobe Linie irreführend, weil sie nicht jeder Kurve folgt. */
  var ANREISE_MAX_ZOOM = 12;

  var TRIP = "München Hbf 06:09 → Trevæld 20:00\n13 Std 51 Min · Zug, Zug, Zug, Bus";

  /* Zwischenpunkte liegen grob am tatsächlichen Streckenverlauf,
     damit die Linie nicht quer durchs Land schneidet. */
  var LEGS = [
    { style: "walk", points: [[48.136198, 11.562735], [48.140411, 11.558268]] },
    { style: "rail", points: [
      [48.140411, 11.558268], [48.744900, 11.437400], [49.445500, 11.082400],
      [49.801600, 9.935800], [50.554500, 9.684400], [51.312800, 9.447000],
      [51.536600, 9.926500], [52.376500, 9.741100], [53.249600, 10.414700],
      [53.456255, 9.991618]
    ] },
    { style: "rail", points: [
      [53.456255, 9.991618], [53.552800, 10.006800], [53.552800, 9.935000],
      [53.604700, 9.904200], [53.655355, 9.797693]
    ] },
    { style: "rail", points: [
      [53.655355, 9.797693], [53.753900, 9.653400], [54.072300, 9.980800],
      [54.303300, 9.664700], [54.506000, 9.568000], [54.774671, 9.436837]
    ] },
    { style: "bus", points: [
      [54.774671, 9.436837], [54.825000, 9.360000], [55.044400, 9.418000],
      [55.249700, 9.489000], [55.490400, 9.472200], [55.709000, 9.535000],
      [55.850000, 9.240000], [56.139000, 8.976000], [56.380000, 8.870000],
      [56.426296, 8.940061]
    ] }
  ];

  /* minZoom staffelt die Beschriftung: erst die Endpunkte, dann die Umstiege. */
  var STOPS = [
    { at: [48.136198, 11.562735], name: "Landwehrstraße 13", time: "Treffpunkt",         minZoom: 11 },
    { at: [48.140411, 11.558268], name: "München Hbf",       time: "ab 06:09 · ICE 886",  minZoom: 5 },
    { at: [53.456255, 9.991618],  name: "Hamburg-Harburg",   time: "11:44 → 11:59 · S3",  minZoom: 7 },
    { at: [53.655355, 9.797693],  name: "Pinneberg",         time: "12:53 → 12:57 · RE7", minZoom: 9, side: "left" },
    { at: [54.774671, 9.436837],  name: "Flensburg Hbf",     time: "14:42 → 16:30 · Bus", minZoom: 7 },
    { at: [56.426296, 8.940061],  name: "Trevæld",           time: "an 20:00",            minZoom: 5, side: "left", dot: false }
  ];

  var el = function (id) { return document.getElementById(id); };

  if (typeof L === "undefined") {
    var failure = document.createElement("div");
    failure.className = "failure";
    failure.innerHTML = "<p><strong>Karte konnte nicht geladen werden</strong>" +
      "Die Kartenbibliothek war nicht erreichbar. Adresse: " + CONFIG.name + ", " + CONFIG.adr + "</p>";
    document.body.appendChild(failure);
    return;
  }

  /* ---------------- Einstellungen aus dem Link ---------------- */

  var params = new URLSearchParams(location.search);
  var config = Object.assign({}, CONFIG);
  ["name", "adr"].forEach(function (key) {
    if (params.has(key)) config[key] = params.get(key);
  });
  ["lat", "lng", "clat", "clng", "z"].forEach(function (key) {
    var value = parseFloat(params.get(key));
    if (!isNaN(value)) config[key] = value;
  });
  if (params.has("anreise")) config.anreise = params.get("anreise") === "1";

  var place = L.latLng(config.lat, config.lng);
  var viewFromLink = params.has("z") || params.has("clat") || params.has("clng");

  var anreiseBounds = null;
  LEGS.forEach(function (leg) {
    var bounds = L.latLngBounds(leg.points);
    anreiseBounds = anreiseBounds ? anreiseBounds.extend(bounds) : bounds;
  });

  /* ---------------- Karte ---------------- */

  var map = L.map("map", {
    zoomControl: false,
    scrollWheelZoom: false,
    maxZoom: 19
  });

  if (viewFromLink) {
    var center = (config.clat !== null && config.clng !== null)
      ? L.latLng(config.clat, config.clng)
      : place;
    map.setView(center, config.z);
  } else if (config.anreise) {
    map.fitBounds(anreiseBounds, { padding: [44, 44], animate: false });
  } else {
    map.setView(place, HOUSE_ZOOM);
  }

  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19,
    attribution: "Luftbild: Esri, Maxar, Earthstar Geographics"
  }).addTo(map);

  L.control.zoom({ position: "bottomright" }).addTo(map);

  /* ---------------- Nadel und Infokarte ---------------- */

  var pinIcon = L.divIcon({
    className: "",
    iconSize: [30, 40],
    iconAnchor: [15, 40],
    html: '<div class="pin"><svg width="30" height="40" viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M15 39c0-9 11-14.5 11-24A11 11 0 1 0 4 15c0 9.5 11 15 11 24z" fill="#0b5d4e"/>' +
          '<circle cx="15" cy="14.5" r="4.4" fill="#fff"/></svg></div>'
  });
  var pin = L.marker(place, { icon: pinIcon, keyboard: false, alt: config.name }).addTo(map);

  el("c-trip").textContent = TRIP;

  function describePlace() {
    pin.setLatLng(place);
    el("c-name").textContent = el("b-name").value.trim() || config.name;
    el("c-adr").textContent = el("b-adr").value.trim() || config.adr;
    el("c-coords").textContent = place.lat.toFixed(4) + ", " + place.lng.toFixed(4);
    el("c-route").href = "https://www.google.com/maps/dir/?api=1&destination=" + place.lat + "," + place.lng;
  }

  /* ---------------- Anreise ---------------- */

  var STROKES = {
    walk: { weight: 3, dashArray: "1 7" },
    rail: { weight: 3.5, dashArray: null },
    bus:  { weight: 3.5, dashArray: "9 7" }
  };

  var anreiseLayer = L.layerGroup();
  var stopMarkers = [];

  LEGS.forEach(function (leg) {
    var stroke = STROKES[leg.style];
    L.polyline(leg.points, {
      color: "#ffffff", weight: stroke.weight + 3, opacity: .8,
      lineCap: "round", lineJoin: "round", interactive: false
    }).addTo(anreiseLayer);
    L.polyline(leg.points, {
      color: "#d92d20", weight: stroke.weight, opacity: 1,
      dashArray: stroke.dashArray, lineCap: "round", lineJoin: "round", interactive: false
    }).addTo(anreiseLayer);
  });

  STOPS.forEach(function (stop) {
    var classes = "stop";
    if (stop.side === "left") classes += " left";
    if (stop.dot === false) classes += " nodot";
    var marker = L.marker(stop.at, {
      keyboard: false,
      interactive: false,
      icon: L.divIcon({
        className: classes,
        iconSize: [12, 12],
        iconAnchor: [6, 6],
        html: '<span class="stop-dot"></span><span class="stop-chip"><b>' +
              stop.name + '</b><i>' + stop.time + '</i></span>'
      })
    });
    marker.addTo(anreiseLayer);
    stopMarkers.push({ marker: marker, minZoom: stop.minZoom });
  });

  function refreshAnreise() {
    var zoom = map.getZoom();
    var visible = config.anreise && zoom <= ANREISE_MAX_ZOOM;

    if (visible && !map.hasLayer(anreiseLayer)) anreiseLayer.addTo(map);
    if (!visible && map.hasLayer(anreiseLayer)) map.removeLayer(anreiseLayer);

    el("to-route").setAttribute("aria-pressed", String(visible));
    el("to-house").setAttribute("aria-pressed", String(!visible));
    el("to-route").hidden = !config.anreise;
    el("card").dataset.view = visible ? "anreise" : "haus";
    if (!visible) return;

    stopMarkers.forEach(function (entry) {
      var element = entry.marker.getElement();
      if (element) element.classList.toggle("quiet", zoom < entry.minZoom);
    });
  }

  map.on("zoomend", refreshAnreise);

  el("to-house").addEventListener("click", function () {
    map.setView(place, HOUSE_ZOOM, { animate: false });
  });
  el("to-route").addEventListener("click", function () {
    map.fitBounds(anreiseBounds, { padding: [44, 44], animate: false });
  });

  /* ---------------- Vollbild, falls die Umgebung es erlaubt ---------------- */

  var root = document.documentElement;
  var enterFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
  var leaveFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
  var inFullscreen = function () { return document.fullscreenElement || document.webkitFullscreenElement; };

  if ((document.fullscreenEnabled || document.webkitFullscreenEnabled) && enterFullscreen) {
    el("expand").classList.add("available");
    el("expand").addEventListener("click", function () {
      if (inFullscreen()) leaveFullscreen.call(document);
      else enterFullscreen.call(root);
    });
    document.addEventListener("fullscreenchange", function () { map.invalidateSize(); });
    document.addEventListener("webkitfullscreenchange", function () { map.invalidateSize(); });
  }

  /* ---------------- Rücksicht auf die Notion-Seite ---------------- */
  /* Mausrad zoomt erst nach einem Klick, Finger bewegen die Karte nur zu zweit.
     Sonst bleibt die Notion-Seite beim Scrollen in der Karte hängen. */

  var hint = el("hint");
  var hintTimer = null;

  function flashHint(text) {
    hint.textContent = text;
    hint.classList.add("show");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hint.classList.remove("show"); }, 1400);
  }

  var container = map.getContainer();

  container.addEventListener("wheel", function () {
    if (!map.scrollWheelZoom.enabled()) flashHint("Zum Zoomen erst in die Karte klicken");
  }, { passive: true });

  map.on("click", function () { map.scrollWheelZoom.enable(); });
  map.on("mouseout", function () { map.scrollWheelZoom.disable(); });

  if (window.matchMedia("(hover: none)").matches) {
    map.dragging.disable();
    container.addEventListener("touchstart", function (event) {
      if (event.touches.length > 1) map.dragging.enable();
    }, { passive: true });
    container.addEventListener("touchmove", function (event) {
      if (event.touches.length === 1 && !map.dragging.enabled()) flashHint("Mit zwei Fingern bewegen");
    }, { passive: true });
    container.addEventListener("touchend", function (event) {
      if (event.touches.length === 0) map.dragging.disable();
    }, { passive: true });
  }

  describePlace();
  refreshAnreise();

  /* ---------------- Baukasten (nur beim direkten Aufruf sichtbar) ---------------- */

  if (window.self !== window.top) return;

  el("bar").classList.add("show");
  document.body.classList.add("building");
  el("b-name").value = config.name;
  el("b-adr").value = config.adr;
  el("b-anreise").checked = config.anreise;

  function updateLink() {
    var center = map.getCenter();
    var query = new URLSearchParams({
      lat: place.lat.toFixed(6),
      lng: place.lng.toFixed(6),
      clat: center.lat.toFixed(6),
      clng: center.lng.toFixed(6),
      z: String(map.getZoom()),
      name: el("b-name").value.trim(),
      adr: el("b-adr").value.trim()
    });
    if (!config.anreise) query.set("anreise", "0");
    el("b-link").value = location.origin + location.pathname + "?" + query.toString();
  }

  map.on("moveend", updateLink);
  map.on("click", function (event) {
    place = event.latlng;
    describePlace();
    updateLink();
  });
  el("b-name").addEventListener("input", function () { describePlace(); updateLink(); });
  el("b-adr").addEventListener("input", function () { describePlace(); updateLink(); });
  el("b-anreise").addEventListener("change", function () {
    config.anreise = el("b-anreise").checked;
    refreshAnreise();
    updateLink();
  });
  updateLink();

  el("b-copy").addEventListener("click", function () {
    var button = el("b-copy");
    var done = function () {
      button.textContent = "Kopiert";
      setTimeout(function () { button.textContent = "Link kopieren"; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(el("b-link").value).then(done, function () { el("b-link").select(); });
    } else {
      el("b-link").select();
      document.execCommand("copy");
      done();
    }
  });
})();
</script>
</body>
</html>
